name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - "tf/__init__.py"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import ast; tree=ast.parse(open('tf/__init__.py').read()); print(next(n.value.value for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets)))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Check PyPI
        id: pypi
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/trajectory-forecast/$VERSION/json/")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "trajectory-forecast $VERSION already exists on PyPI; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "trajectory-forecast $VERSION is new and will be published."
          fi

      - name: Install build tools
        if: steps.pypi.outputs.exists == 'false'
        run: python -m pip install --upgrade build

      - name: Build package
        if: steps.pypi.outputs.exists == 'false'
        run: python -m build

      - name: Publish to PyPI
        if: steps.pypi.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
